{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:450px; margin:auto;">
    <h2>Регистрация</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Зарегистрироваться</button>
    </form>
    <p style="margin-top:12px;">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>
{% endblock %}
